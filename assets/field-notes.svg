<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Himanshu Dixit — The Build Log</title>
<desc id="desc">An original editorial technical banner, with a coordinate grid, a neon yellow signal line, and the motto: Make useful things. Understand every part.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111923"/><stop offset="1" stop-color="#1a2c36"/></linearGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#8aa0a9" stroke-opacity=".13" stroke-width="1"/></pattern>
  <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d9fb6d" fill-opacity=".25"/></pattern>
</defs>
<rect width="1200" height="360" rx="18" fill="url(#bg)"/>
<rect width="1200" height="360" rx="18" fill="url(#grid)"/>
<path d="M780 -10L1010 360M850 -10L1080 360M920 -10L1150 360" stroke="#88a0a8" stroke-opacity=".11" stroke-width="1"/>
<rect x="48" y="42" width="7" height="275" rx="3" fill="#d9fb6d"/>
<text x="78" y="66" font-family="monospace" font-size="13" letter-spacing="3" fill="#d9fb6d">THE BUILD LOG / HD—01</text>
<text x="76" y="142" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="-2" fill="#f3f5f0">Himanshu Dixit</text>
<text x="80" y="181" font-family="monospace" font-size="15" letter-spacing="2" fill="#b6c6cc">COMPUTER SCIENCE · BUILDER IN TRAINING</text>
<line x1="80" y1="211" x2="705" y2="211" stroke="#799099" stroke-opacity=".5"/>
<text x="80" y="249" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#f3f5f0">Make useful things.</text>
<text x="80" y="279" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#d9fb6d">Understand every part.</text>
<text x="80" y="319" font-family="monospace" font-size="11" letter-spacing="2" fill="#8fa3ac">JAVA / JAVASCRIPT / PYTHON</text>
<g transform="translate(910 176)">
  <circle r="116" fill="none" stroke="#8aa0a9" stroke-opacity=".35"/>
  <circle r="87" fill="none" stroke="#8aa0a9" stroke-opacity=".42" stroke-dasharray="2 8"/>
  <circle r="58" fill="url(#dots)" stroke="#d9fb6d" stroke-width="1.5"/>
  <path d="M-140 0H140M0 -140V140" stroke="#8aa0a9" stroke-opacity=".35"/>
  <path d="M-96 62L-48 18L-7 35L42 -31L84 -12L128 -65" fill="none" stroke="#d9fb6d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="-96" cy="62" r="5" fill="#d9fb6d"/><circle cx="-48" cy="18" r="5" fill="#d9fb6d"/><circle cx="-7" cy="35" r="5" fill="#d9fb6d"/><circle cx="42" cy="-31" r="5" fill="#d9fb6d"/><circle cx="84" cy="-12" r="5" fill="#d9fb6d"/><circle cx="128" cy="-65" r="5" fill="#d9fb6d"/>
  <rect x="-30" y="-15" width="60" height="30" rx="4" fill="#d9fb6d"/><text x="0" y="5" text-anchor="middle" font-family="monospace" font-weight="700" font-size="13" fill="#111923">HD</text>
</g>
<text x="1110" y="330" text-anchor="end" font-family="monospace" font-size="10" letter-spacing="2" fill="#6f8791">VERSION 02.0</text>
