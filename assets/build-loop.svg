<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="220" viewBox="0 0 1120 220" role="img" aria-labelledby="title desc">
<title id="title">The build loop</title><desc id="desc">A five-step engineering loop: Notice a problem, prototype the smallest solution, test real cases, document trade-offs, repeat.</desc>
<rect width="1120" height="220" rx="14" fill="#f3f3eb"/>
<text x="28" y="34" font-family="monospace" font-size="11" letter-spacing="2" fill="#637064">THE BUILD LOOP / A PERSONAL WORKING METHOD</text>
<g font-family="Arial, Helvetica, sans-serif">
 <rect x="28" y="62" width="190" height="99" rx="9" fill="#18252d"/>
 <text x="46" y="87" font-family="monospace" font-size="10" fill="#d9fb6d">01 / NOTICE</text><text x="46" y="118" font-size="19" font-weight="700" fill="#f5f6f0">Find friction</text><text x="46" y="140" font-size="11" fill="#b8c5c7">What needs to improve?</text>
 <path d="M222 111h24m-7 -7 7 7 -7 7" fill="none" stroke="#758373" stroke-width="2"/>
 <rect x="252" y="62" width="190" height="99" rx="9" fill="#d9fb6d"/>
 <text x="270" y="87" font-family="monospace" font-size="10" fill="#4e622f">02 / PROTOTYPE</text><text x="270" y="118" font-size="19" font-weight="700" fill="#18252d">Build small</text><text x="270" y="140" font-size="11" fill="#4e5b44">One useful path first.</text>
 <path d="M446 111h24m-7 -7 7 7 -7 7" fill="none" stroke="#758373" stroke-width="2"/>
 <rect x="476" y="62" width="190" height="99" rx="9" fill="#dce8f1"/>
 <text x="494" y="87" font-family="monospace" font-size="10" fill="#526c7f">03 / VERIFY</text><text x="494" y="118" font-size="19" font-weight="700" fill="#18252d">Test honestly</text><text x="494" y="140" font-size="11" fill="#526270">Check cases, not vibes.</text>
 <path d="M670 111h24m-7 -7 7 7 -7 7" fill="none" stroke="#758373" stroke-width="2"/>
 <rect x="700" y="62" width="190" height="99" rx="9" fill="#e8e5dc"/>
 <text x="718" y="87" font-family="monospace" font-size="10" fill="#777568">04 / EXPLAIN</text><text x="718" y="118" font-size="19" font-weight="700" fill="#18252d">Write it down</text><text x="718" y="140" font-size="11" fill="#68685e">Trade-offs and limits.</text>
 <path d="M894 111h24m-7 -7 7 7 -7 7" fill="none" stroke="#758373" stroke-width="2"/>
 <rect x="924" y="62" width="168" height="99" rx="9" fill="#18252d"/>
 <text x="942" y="87" font-family="monospace" font-size="10" fill="#d9fb6d">05 / ITERATE</text><text x="942" y="118" font-size="19" font-weight="700" fill="#f5f6f0">Repeat</text><text x="942" y="140" font-size="11" fill="#b8c5c7">Improve with evidence.</text>
</g>
<text x="28" y="195" font-family="monospace" font-size="10" letter-spacing="1" fill="#657164">RULE: IF I CAN'T EXPLAIN A FEATURE, I HAVEN'T FINISHED LEARNING IT.</text>
</svg>